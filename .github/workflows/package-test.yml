name: Package test

"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-smoke:
    name: ${{ matrix.os }} / CPython ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
      - name: Install locked build tools
        run: python -m pip install uv==0.11.24 pipx==1.7.1
      - name: Build wheel and source distribution
        run: uv build --no-sources
      - name: Install and run both distributions
        shell: bash
        env:
          WEBHOOK_CONFORMANCE_DEBUG: "1"
        run: >-
          python scripts/package_smoke.py
          --artifact dist/webhook_receiver_conformance-0.1.0-py3-none-any.whl
          --artifact dist/webhook_receiver_conformance-0.1.0.tar.gz
          --python "${{ matrix.python }}"
          --exercise-runners
          --expected-digest sha256:178dc7ee90d54e25ff4e8bd498126a95e7694e2f52644875dc3af9d313d35099
