name: Package test

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-smoke:
    name: ${{ matrix.os }} / CPython ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
      - name: Install locked build tools
        run: python -m pip install uv==0.11.24 pipx==1.7.1
      - name: Build wheel and source distribution
        run: uv build --no-sources
      - name: Install and run both distributions
        shell: bash
        run: >-
          python scripts/package_smoke.py
          --artifact dist/webhook_receiver_conformance-0.1.0-py3-none-any.whl
          --artifact dist/webhook_receiver_conformance-0.1.0.tar.gz
          --python "${{ matrix.python }}"
          --exercise-runners
          --expected-digest sha256:66c361e5c82d111575e14811d86e3ed7f03eb3a13018aa4d5d5c30ac26681e35
