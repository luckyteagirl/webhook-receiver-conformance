name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locked-matrix:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned uv and CPython
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.24"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Synchronize locked environment
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest -q tests

      - name: Validate schemas and cross-references
        run: uv run python scripts/validate_artifacts.py

      - name: Build wheel and source distribution
        run: uv build

      - name: Smoke-test installed wheel and source distribution
        shell: uv run python {0}
        run: |
          from pathlib import Path
          import os
          import subprocess
          import sys

          wheels = tuple(Path("dist").glob("*.whl"))
          sdists = tuple(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == len(sdists) == 1, (wheels, sdists)
          assert wheels[0].name.endswith("-py3-none-any.whl"), wheels[0]

          smoke = (
              "import webhook_receiver_conformance; "
              "from importlib.metadata import version; "
              "from webhook_receiver_conformance.version import VERSION_METADATA; "
              "assert VERSION_METADATA.package == "
              "version('webhook-receiver-conformance')"
          )
          for env, artifact in zip(
              (".smoke-wheel", ".smoke-sdist"),
              (wheels[0], sdists[0]),
              strict=True,
          ):
              subprocess.check_call(
                  ["uv", "venv", "--clear", "--python", sys.executable, env]
              )
              executable = Path(env) / (
                  "Scripts/python.exe" if os.name == "nt" else "bin/python"
              )
              subprocess.check_call(
                  [
                      "uv",
                      "pip",
                      "install",
                      "--no-deps",
                      "--python",
                      str(executable),
                      str(artifact),
                  ]
              )
              subprocess.check_call([str(executable), "-I", "-c", smoke])
