version: 2

# Review policy for dependency pull requests:
# - Every `security-sensitive-*` group requires focused review of its named trust
#   boundary before merge; do not combine it with routine development updates.
# - Transport review covers destination pinning, proxy/redirect behavior, TLS, and
#   cancellation. Parser/schema review covers strictness, resource bounds, and
#   unsafe object construction. Crypto review covers signing and secret handling.
#   Template/report review covers terminal, HTML, XML, and structured-data escaping.
# Repository-level reviewer enforcement belongs in CODEOWNERS and branch protection;
# this file deliberately identifies the classes without inventing reviewer accounts.
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      security-sensitive-transport:
        patterns:
          - anyio
          - certifi
          - h11
          - httpcore
          - httpx
          - idna
      security-sensitive-parser-schema:
        patterns:
          - jsonschema
          - jsonschema-specifications
          - pyyaml
          - referencing
          - rpds-py
      security-sensitive-crypto-signing:
        patterns:
          - cffi
          - cryptography
          - pynacl
          - pycryptodome
      security-sensitive-template-report:
        patterns:
          - jinja2
          - markupsafe
          - pydantic
          - pydantic-core
          - rich
          - typer
      routine-development:
        dependency-type: development
        patterns:
          - hatchling
          - hypothesis
          - pyright
          - pytest
          - ruff

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      ci-actions:
        patterns:
          - actions/*
          - astral-sh/setup-uv
