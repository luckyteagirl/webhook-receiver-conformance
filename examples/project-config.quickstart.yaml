schema_version: 1
project:
  name: quickstart-local-receiver-test
  artifact_directory: .webhook-conformance
  seed: local-five-minute-example
receiver:
  url: http://127.0.0.1:8000/webhooks/generic-hmac-sha256/local-account
  target_profile: loopback
  allowed_hosts:
  - 127.0.0.1
  allowed_ports:
  - 8000
  timeouts:
    connect: 5s
    write: 5s
    read: 5s
    pool: 5s
    total: 30s
fixtures:
- id: payment_succeeded
  path: fixtures/payment_succeeded.json
  media_type: application/json
signers:
  test_hmac:
    profile: generic-hmac-sha256
    secret:
      env: WEBHOOK_TEST_SECRET
    header_name: X-Test-Signature
observers: {}
lifecycles: {}
clock:
  mode: scaled
  scale: "0.01"
  minimum_physical_wait: 1ms
limits:
  max_events: 100
  max_attempts: 500
  max_request_bytes: 1048576
  max_response_capture_bytes: 65536
scenarios:
- id: single_valid_delivery
  events:
  - id: payment
    fixture: payment_succeeded
  steps:
  - deliver:
      event: payment
      signer: test_hmac
      retry:
        max_attempts: 1
        backoff: []
        retry_on: []
  assertions:
  - id: accepted
    type: http-status
    attempt:
      event: payment
      mode: all-terminal
    expected:
      codes:
      - 200
      - 204
reports:
  formats:
  - json
  - jsonl
  - junit
  - html
  redaction:
    headers:
    - authorization
    - x-test-signature
    json_pointers:
    - /data/customer_email
    retain_raw_payloads: false
