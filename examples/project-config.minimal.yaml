schema_version: 1
project:
  name: minimal-local-receiver-test
  artifact_directory: .webhook-conformance
receiver:
  url: http://127.0.0.1:8000/webhooks
  target_profile: loopback
fixtures:
- id: payment_succeeded
  path: fixtures/payment_succeeded.json
  media_type: application/json
signers:
  test_hmac:
    profile: generic-hmac-sha256
    secret:
      env: WEBHOOK_TEST_SECRET
    header_name: X-Test-Signature
observers:
  receiver_state:
    type: command
    argv:
    - python
    - tests/observer.py
    timeout: 2s
    environment_allowlist:
    - TEST_DATABASE_URL
clock:
  mode: scaled
  scale_numerator: 1
  scale_denominator: 100
  minimum_physical_wait: 1ms
limits:
  max_events: 100
  max_attempts: 500
  max_concurrency: 10
  max_request_bytes: 1048576
  max_response_capture_bytes: 65536
scenarios:
- id: sequential_duplicate
  events:
  - id: payment
    fixture: payment_succeeded
  steps:
  - deliver:
      event: payment
      count: 2
      signer: test_hmac
      retry:
        max_attempts: 1
        backoff: []
  - observe:
      observer: receiver_state
      checkpoint: after_duplicate
  assertions:
  - id: accepted
    type: http-status
    expected:
    - 200
    - 204
  - id: processed_once
    type: processing-count
    observer: receiver_state
    event: payment
    expected: 1
    within: 2s
    poll_interval: 50ms
reports:
  formats:
  - json
  - jsonl
  - junit
  - html
  redaction:
    headers:
    - authorization
    - x-test-signature
    json_pointers:
    - /data/customer_email
    retain_raw_payloads: false
