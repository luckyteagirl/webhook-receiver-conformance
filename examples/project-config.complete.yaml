schema_version: 1
project:
  name: complete-local-receiver-test
  artifact_directory: .webhook-conformance
  seed: local-complete-example
  secret_roots:
  - .secrets
receiver:
  url: http://127.0.0.1:8000/webhooks/generic-hmac-sha256/local-account
  target_profile: loopback
  allowed_hosts:
  - 127.0.0.1
  allowed_ports:
  - 8000
  public_challenge_path: /.well-known/webhook-conformance-challenge
  timeouts:
    connect: 5s
    write: 5s
    read: 5s
    pool: 5s
    total: 30s
fixtures:
- id: payment_succeeded
  path: fixtures/payment_succeeded.json
  media_type: application/json
  event_id_pointer: /id
  event_type_pointer: /type
signers:
  test_hmac:
    profile: generic-hmac-sha256
    secret:
      env: WEBHOOK_TEST_SECRET
    header_name: X-Test-Signature
observers:
  receiver_state_command:
    type: command
    argv:
    - python
    - observers/command_observer.py
    timeout: 2s
    working_directory: .
    environment_allowlist:
    - WEBHOOK_OBSERVER_TOKEN
    - WEBHOOK_RECEIVER_DB
  receiver_state_http:
    type: http
    base_url: http://127.0.0.1:8001
    token:
      env: WEBHOOK_OBSERVER_TOKEN
    timeouts:
      connect: 2s
      read: 2s
      total: 5s
lifecycles: {}
clock:
  mode: scaled
  scale: "0.01"
  minimum_physical_wait: 1ms
limits:
  max_events: 100
  max_attempts: 500
  max_concurrency: 10
  max_request_bytes: 1048576
  max_response_capture_bytes: 65536
scenarios:
- id: sequential_duplicate
  description: Duplicate delivery should not duplicate the durable business effect.
  events:
  - id: payment
    fixture: payment_succeeded
  steps:
  - deliver:
      event: payment
      count: 2
      signer: test_hmac
      retry:
        max_attempts: 1
        backoff: []
        retry_on: []
  - observe:
      observer: receiver_state_command
      checkpoint: after_duplicate_command
  - observe:
      observer: receiver_state_http
      checkpoint: after_duplicate_http
  assertions:
  - id: accepted
    type: http-status
    attempt:
      event: payment
      mode: all-terminal
    expected:
      codes:
      - 200
      - 204
  - id: processed_once_command
    type: processing-count
    query:
      observer: receiver_state_command
      key: processing_count
      parameters: {}
    comparator: eq
    expected: 1
    within: 2s
    poll_interval: 50ms
  - id: processed_once_http
    type: processing-count
    query:
      observer: receiver_state_http
      key: processing_count
      parameters: {}
    comparator: eq
    expected: 1
    within: 2s
    poll_interval: 50ms
  failure_policy: continue-scenario
- id: timeout_then_retry
  description: A timeout does not justify assuming that the first business effect failed.
  events:
  - id: payment_retry
    fixture: payment_succeeded
  steps:
  - deliver:
      event: payment_retry
      signer: test_hmac
      timeout: 250ms
      retry:
        max_attempts: 2
        backoff:
        - 2s
        retry_on:
        - timed_out
        jitter: 100ms
  assertions:
  - id: accepted_after_retry
    type: http-status
    attempt:
      event: payment_retry
      mode: all-terminal
    expected:
      codes:
      - 200
      - 204
reports:
  formats:
  - json
  - jsonl
  - junit
  - html
  redaction:
    headers:
    - authorization
    - x-test-signature
    json_pointers:
    - /data/customer_email
    retain_raw_payloads: false
