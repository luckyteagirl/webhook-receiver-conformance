[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "webhook-receiver-conformance"
version = "0.1.0"
description = "Local-first webhook receiver conformance harness"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Webhook Receiver Conformance contributors" }]
keywords = ["conformance", "testing", "webhook", "webhook-receiver"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Typing :: Typed",
]
dependencies = [
  "anyio>=4.6",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "pydantic>=2.9",
  "pyyaml>=6.0.2",
  "typer>=0.12",
]

[project.scripts]
webhook-conformance = "webhook_receiver_conformance.cli:run_cli"

[project.urls]
Homepage = "https://github.com/luckyteagirl/webhook-receiver-conformance"
Documentation = "https://github.com/luckyteagirl/webhook-receiver-conformance#readme"
Issues = "https://github.com/luckyteagirl/webhook-receiver-conformance/issues"
Source = "https://github.com/luckyteagirl/webhook-receiver-conformance"
Changelog = "https://github.com/luckyteagirl/webhook-receiver-conformance/blob/main/CHANGELOG.md"

[project.optional-dependencies]
reference = ["fastapi>=0.141.1"]

[dependency-groups]
dev = [
  "hypothesis>=6.112",
  "psutil>=7.0",
  "pyright>=1.1.390",
  "pytest>=8.3",
  "ruff>=0.12",
  "types-psutil>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/webhook_receiver_conformance"]

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/pyproject.toml",
  "/src/webhook_receiver_conformance",
]

[tool.pyright]
include = ["src", "tests"]
pythonPlatform = "All"
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "CPY001",
  "D100",
  "D103",
  "D104",
  "D203",
  "D213",
  "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
docstring-code-format = true
