decisions:
- id: ADR-001
  title: Use a Python modular monolith
  status: accepted
  date: '2026-07-26'
  owners:
  - principal architect
  - future maintainer
  context_and_forces: Use a Python modular monolith
  requirements_affected:
  - FR-001
  - FR-007
  - COMPAT-001
  risks_affected:
  - RISK-001
  decision_criteria:
  - correctness
  - testability
  - security
  - local-first operation
  - solo-maintainer complexity
  - cross-platform behavior
  options_considered:
  - Python modular monolith
  - Go single binary
  - Rust single binary
  - Distributed services
  evidence_source_ids:
  - SRC-077
  - SRC-080
  - SRC-046
  selected_decision: Implement v0.1 as one Python package and process with explicit internal component boundaries.
  positive_consequences:
  - Matches maintainer skills and preferred stack.
  - Minimizes operational dependencies.
  - Supports rapid property and integration testing.
  negative_consequences:
  - Python packaging is less self-contained than a native binary.
  - CPU-bound scale is not a design goal.
  rejected_alternatives:
  - Python modular monolith
  - Go single binary
  - Rust single binary
  - Distributed services
  implementation_constraints:
  - Public behavior must remain traceable to normative requirements.
  - Changes require ADR supersession and schema/traceability updates.
  verification_implications:
  - Decision-specific contract and regression tests are required.
  revisit_triggers:
  - Measured install friction prevents adoption.
  - A P0 workload cannot meet documented budgets.
  related_or_superseded_adrs: []
