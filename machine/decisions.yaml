- id: ADR-014
  title: Use allowlisted destination security with permanent metadata blocks
  status: accepted
  date: '2026-07-26'
  owners:
  - principal architect
  - future maintainer
  context_and_forces: Use allowlisted destination security with permanent metadata blocks
  requirements_affected:
  - SEC-001
  - SEC-002
