- id: ADR-009
  title: Preserve unknown network outcomes
  status: accepted
  date: '2026-07-26'
  owners:
  - principal architect
  - future maintainer
  context_and_forces: Preserve unknown network outcomes
  requirements_affected:
  - STATE-008
  - REL-002
  - REL-003
  - REL-006
  risks_affected:
  - RISK-009
  decision_criteria:
  - correctness
  - testability
  - security
  - local-first operation
  - solo-maintainer complexity
  - cross-platform behavior
  options_considered:
  - Assume failure and retry
  - Assume success
  - Infer from socket state
  - Explicit unknown_outcome
  evidence_source_ids:
  - SRC-064
  - SRC-065
  - SRC-075
  selected_decision: When request bytes may have left but terminal evidence is not durably committed, preserve unknown_outcome
    and require explicit reconciliation or redelivery policy.
  positive_consequences:
  - Honest distributed-systems semantics.
  - Makes duplicate physical delivery risk visible.
  negative_consequences:
  - Some runs require operator or observer action.
  - Cannot guarantee no duplicate physical send.
  rejected_alternatives:
  - Assume failure and retry
  - Assume success
  - Infer from socket state
  - Explicit unknown_outcome
  implementation_constraints:
  - Public behavior must remain traceable to normative requirements.
  - Changes require ADR supersession and schema/traceability updates.
  verification_implications:
  - Decision-specific contract and regression tests are required.
  revisit_triggers:
  - A transport API provides a durable sender transaction boundary.
  related_or_superseded_adrs: []
