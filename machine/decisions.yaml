- id: ADR-021
  title: Use context-derived HMAC-SHA256 deterministic generation
  status: accepted
  date: '2026-07-26'
  owners:
  - principal architect
  - determinism maintainer
  context_and_forces: A seed must produce stable independent choices even when unrelated fields are added, while algorithm
    changes must not invalidate an already realized manifest.
  requirements_affected:
  - SCHED-001
  - SCHED-002
  - SCHED-003
  - DATA-008
  risks_affected:
  - RISK-009
  decision_criteria:
  - cross-version stability
  - domain separation
  - random-access derivation
  - testability
  options_considered:
  - Python random.Random
  - PCG stream
  - ChaCha stream
  - context-derived HMAC-SHA256
  evidence_source_ids:
  - SRC-113
  selected_decision: 'Define generator hmac-sha256-context-v1: derive bytes as HMAC-SHA256(seed_key, domain_separator || length-prefixed
    context path || block_index); use rejection sampling for bounded integers. The manifest records every realized value and
    replays without invoking the generator.'
  positive_consequences:
  - Adding an unrelated draw does not shift existing choices.
  - The primitive is ubiquitous and easy to vector-test.
  - Manifest replay is independent of generator implementation.
  negative_consequences:
  - The seed becomes sensitive if users expect generated values to remain private.
  - The algorithm requires an explicit canonical context encoding.
  rejected_alternatives:
  - random.Random is not a public cross-version contract.
  - A sequential stream is fragile when the plan shape changes.
  - ChaCha adds a dependency without improving the realized-manifest guarantee.
  implementation_constraints:
  - Seed material is not a signing key.
  - Contexts are UTF-8 length-prefixed components.
  - Golden vectors are immutable per algorithm version.
  verification_implications:
  - Golden vectors, prefix independence, rejection-sampling, and replay-without-generator tests.
  revisit_triggers:
  - A standards-based deterministic generator materially improves interoperability.
  related_or_superseded_adrs: []
- id: ADR-022
  title: Defer a public third-party plugin API
  status: accepted
  date: '2026-07-26'
  owners:
  - principal architect
  - open-source maintainer
  context_and_forces: Signer, mutation, observer, assertion, and reporter seams are needed internally, but a public plugin
    contract would create an early compatibility burden before external implementations prove the abstractions.
  requirements_affected:
  - API-004
  - COMPAT-008
  - OPS-007
  risks_affected:
  - RISK-016
  decision_criteria:
  - scope discipline
  - compatibility cost
  - two-implementation rule
  - security boundary
  options_considered:
  - Public entry-point plugins in v0.1
  - Internal protocols only
  - No extension seams
  evidence_source_ids:
  - SRC-106
  - SRC-107
  selected_decision: Keep typed internal protocols and built-in registries in v0.1. Publish only the observer wire protocol.
    Revisit entry-point plugins after at least two external adapter contributions or concrete user demand.
  positive_consequences:
  - Avoids freezing speculative APIs.
  - Reduces arbitrary-code loading and supply-chain exposure.
  - Keeps built-ins contract-testable.
  negative_consequences:
  - Third parties must contribute built-ins or wrap the CLI.
  - Provider expansion is initially maintainer-mediated.
  rejected_alternatives:
  - A generic plugin framework has no validated external consumers.
  - Removing all seams would couple core planning to providers.
  implementation_constraints:
  - Internal protocols are not compatibility promises.
  - No dynamic entry-point loading in v0.1.
  - The plugin metadata schema is informational/experimental only.
  verification_implications:
  - Built-in contract suites; negative test that installed entry points are not auto-loaded.
  revisit_triggers:
  - Two independent external implementations need the same category.
  - A v0.2 architecture review accepts a trust model.
  related_or_superseded_adrs: []
- id: ADR-023
  title: Support real and scaled clocks; limit virtual time to in-process tests
  status: accepted
  date: '2026-07-26'
  owners:
  - principal architect
  - scheduler maintainer
  context_and_forces: CI cannot wait through provider-scale backoff, but a local harness cannot virtualize an unmodified external
    receiver clock or network stack honestly.
  requirements_affected:
  - SCHED-007
  - SCHED-008
  - SCHED-009
  - SCHED-010
  risks_affected:
  - RISK-008
  decision_criteria:
  - honest claims
  - CI duration
  - deterministic ordering
  - external compatibility
  options_considered:
  - Real time only
  - Real + scaled
  - Full external virtual time
  - Sleep patching
  evidence_source_ids:
  - SRC-001
  - SRC-022
  - SRC-032
  selected_decision: Provide real and scaled execution modes for network runs. Use integer logical nanoseconds for plan ordering,
    monotonic time for elapsed deadlines, UTC wall time for audit evidence, and virtual time only for pure/in-process unit
    and model tests.
  positive_consequences:
  - CI remains fast.
  - The tool does not claim to control the receiver wall clock.
  - Schedule order and external elapsed time remain distinct.
  negative_consequences:
  - A scaled retry does not prove behavior after the equivalent real-world duration.
  - Time-dependent receivers need their own test-clock hook.
  rejected_alternatives:
  - Full external virtual time is impossible without receiver cooperation.
  - Real-only mode makes backoff corpora impractical.
  implementation_constraints:
  - Every report names clock mode and scale.
  - Timeouts use real monotonic time.
  - Minimum physical intervals prevent zero-duration busy loops.
  verification_implications:
  - Clock-jump, scale-boundary, monotonic-deadline, and false-claim tests.
  revisit_triggers:
  - A standardized receiver test-clock protocol emerges.
  related_or_superseded_adrs: []
- id: ADR-024
  title: Ship three built-in HMAC signature profiles in v0.1
  status: accepted
  date: '2026-07-26'
  owners:
  - principal architect
  - security maintainer
  context_and_forces: The MVP must prove exact-byte signing and replay-window behavior without becoming a provider emulator
    or cryptographic framework.
  requirements_affected:
  - SIG-001
  - SIG-006
  - SIG-009
  - SIG-015
  risks_affected:
  - RISK-003
  - RISK-014
  decision_criteria:
  - market relevance
  - raw-byte fidelity
  - key rotation coverage
  - implementation scope
  options_considered:
  - Generic HMAC only
  - Generic HMAC + Stripe
  - Generic HMAC + Stripe + Standard Webhooks HMAC
  - Include Ed25519
  evidence_source_ids:
  - SRC-001
  - SRC-003
  - SRC-013
  - SRC-113
  - SRC-114
  selected_decision: Ship generic HMAC-SHA256, Stripe v1, and Standard Webhooks HMAC profiles. Defer Ed25519 and other provider
    profiles until the core contract is stable.
  positive_consequences:
  - Covers raw body, timestamps, multiple signatures, and key rotation.
  - Keeps cryptographic surface reviewable.
  - Provides one generic and two concrete profiles.
  negative_consequences:
  - Discord-style Ed25519 receivers need custom test code in v0.1.
  - Provider behavior still requires maintenance.
  rejected_alternatives:
  - Generic-only does not prove provider fidelity.
  - Ed25519 expands key encoding and dependency scope without being required for the first vertical slice.
  implementation_constraints:
  - Sign exact transmitted bytes.
  - Use fixed official/golden vectors.
  - Never serialize secret key material.
  verification_implications:
  - Official/golden vectors, altered-body, stale timestamp, wrong-key, multiple-key, and malformed-header cases.
  revisit_triggers:
  - Measured demand from an Ed25519 provider integration.
  related_or_superseded_adrs: []
- id: ADR-025
  title: Use JUnit, structured JSON Lines, and static HTML; reject runtime SARIF
  status: accepted
  date: '2026-07-26'
  owners:
  - principal architect
  - reporting maintainer
  context_and_forces: CI needs test-result ingestion, developers need complete causal evidence, and reports render untrusted
    fixture content.
  requirements_affected:
  - REPORT-001
  - REPORT-006
  - REPORT-011
  - REPORT-015
  risks_affected:
  - RISK-015
  decision_criteria:
  - CI compatibility
  - lossless evidence
  - security
  - standards fit
  options_considered:
  - JUnit only
  - SARIF
  - JSON/JSONL only
  - JUnit + JSON/JSONL + static HTML
  evidence_source_ids:
  - SRC-118
  - SRC-119
  - SRC-102
  selected_decision: Emit an immutable manifest, append-oriented JSON Lines evidence, a machine summary, JUnit XML, and a
    no-script escaped HTML report. Do not emit SARIF for runtime outcomes.
  positive_consequences:
  - CI systems receive conventional test cases.
  - Lossless evidence remains schema-backed.
  - Static HTML reduces injection surface.
  negative_consequences:
  - Several synchronized renderers must agree.
  - JUnit attachment behavior varies by CI provider.
  rejected_alternatives:
  - SARIF models static-analysis findings rather than network attempt lifecycles.
  - JUnit alone cannot preserve full causal evidence.
  implementation_constraints:
  - The journal is the reporting authority.
  - Renderers are pure/idempotent.
  - HTML contains no active content.
  verification_implications:
  - Cross-renderer verdict checks, XML parsing, schema validation, secret canaries, and XSS payload corpus.
  revisit_triggers:
  - A specific CI integration requires another export format.
  related_or_superseded_adrs: []
