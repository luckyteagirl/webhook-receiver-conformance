  - Block all public URLs permanently
  - Dual authorization with address validation
  evidence_source_ids:
  - SRC-041
  - SRC-019
  - SRC-021
  selected_decision: Allow loopback and explicitly named local hosts by default; require configuration plus CLI confirmation
