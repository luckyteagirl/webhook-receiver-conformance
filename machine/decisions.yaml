- id: ADR-004
  title: Use a single-writer SQLite rollback journal
  status: accepted
  date: '2026-07-26'
  owners:
  - principal architect
  - future maintainer
  context_and_forces: The v0.1 core needs durable local state, crash recovery, simple packaging, and one active writer per
    run; it does not need concurrent distributed writers.
  requirements_affected:
  - DATA-001
  - DATA-002
  - DATA-003
  - REL-001
  - REL-004
  risks_affected:
  - RISK-006
  - RISK-007
  decision_criteria:
  - correctness
  - testability
  - security
  - local-first operation
  - solo-maintainer complexity
  - cross-platform behavior
  options_considered:
  - SQLite rollback journal DELETE + synchronous EXTRA
  - SQLite WAL + synchronous FULL
  - Append-only files only
  - PostgreSQL
  evidence_source_ids:
  - SRC-084
  - SRC-085
  - SRC-086
  - SRC-087
  - SRC-088
  selected_decision: Use one local SQLite database per run bundle with journal_mode=DELETE, synchronous=EXTRA, foreign_keys=ON,
    trusted_schema=OFF, explicit BEGIN IMMEDIATE write transactions, and one owning process.
  positive_consequences:
  - Hot-journal recovery is built into SQLite.
  - No checkpoint subsystem or WAL sidecars are required.
  - The design matches the single-writer product boundary.
  - Current WAL-specific recovery risk is avoided.
  negative_consequences:
  - Readers block briefly during commits.
  - The database must remain on a local filesystem.
  - Parallel processes cannot write one run.
  rejected_alternatives:
  - WAL adds checkpoint and sidecar complexity without a measured reader-concurrency need.
  - Append-only files alone make relational integrity and recovery scans harder.
  - PostgreSQL violates local-first zero-service operation.
  implementation_constraints:
  - One process owns a run directory.
  - All state transitions occur through the journal service.
  - Database files on network filesystems are unsupported.
  - Migrations are transactional and append-only.
  verification_implications:
  - Crash every transaction boundary.
  - Verify hot-journal recovery and foreign-key integrity.
  - Reject concurrent ownership.
  revisit_triggers:
  - Measured report readers require concurrent reads during long writes.
  - A distributed execution requirement is accepted.
  related_or_superseded_adrs: []
- id: ADR-005
  title: Use HMAC-SHA256 counter generation and RFC 8785 manifests
  status: accepted
  date: '2026-07-26'
  owners:
  - principal architect
  - future maintainer
  context_and_forces: Use HMAC-SHA256 counter generation and RFC 8785 manifests
  requirements_affected:
  - SCHED-001
  - SCHED-004
  - SCHED-005
  risks_affected:
  - RISK-005
  decision_criteria:
  - correctness
  - testability
  - security
  - local-first operation
  - solo-maintainer complexity
  - cross-platform behavior
  options_considered:
  - Python random seed
  - PCG implementation
  - HMAC-SHA256 counter generator plus realized manifest
  - UUID-only random generation
  evidence_source_ids:
  - SRC-018
  - SRC-030
  - SRC-031
  - SRC-033
  selected_decision: Define wrch-hmac-drbg-v1 for deterministic choices and RFC 8785 canonical JSON for content hashes; record
    all realized values so replay never depends on generator stability.
  positive_consequences:
  - Simple, portable test vectors.
  - Algorithm changes cannot affect existing manifests.
  - Cryptographic primitive is widely available.
  negative_consequences:
  - Requires a small specified sampler and JCS implementation dependency.
  - JCS constrains numeric representation.
  rejected_alternatives:
  - Python random seed
  - PCG implementation
  - HMAC-SHA256 counter generator plus realized manifest
  - UUID-only random generation
  implementation_constraints:
  - Public behavior must remain traceable to normative requirements.
  - Changes require ADR supersession and schema/traceability updates.
  verification_implications:
  - Decision-specific contract and regression tests are required.
  revisit_triggers:
  - Canonicalization library becomes unmaintained.
  - Interoperability vectors fail across runtimes.
  related_or_superseded_adrs: []
- id: ADR-006
  title: Use integer microsecond logical time with real and scaled modes
  status: accepted
  date: '2026-07-26'
  owners:
  - principal architect
  - future maintainer
  context_and_forces: Use integer microsecond logical time with real and scaled modes
  requirements_affected:
  - SCHED-006
  - SCHED-007
  - SCHED-008
  - SCHED-009
  risks_affected:
  - RISK-006
  decision_criteria:
  - correctness
  - testability
  - security
  - local-first operation
  - solo-maintainer complexity
  - cross-platform behavior
  options_considered:
  - Floating seconds
  - Integer nanoseconds
  - Integer microseconds real/scaled
  - Full virtual clock
  evidence_source_ids:
  - SRC-032
  - SRC-033
  - SRC-019
  selected_decision: Represent logical time as integer microseconds; use monotonic real deadlines; support real and rationally
    scaled delays in v0.1; defer external virtual time.
  positive_consequences:
  - Avoids floating drift.
  - Readable and sufficient precision for webhook conformance.
  - Does not overclaim control of external systems.
  negative_consequences:
  - Sub-microsecond scheduling is unsupported.
  - Scaled time cannot prove receiver wall-clock behavior.
  rejected_alternatives:
  - Floating seconds
  - Integer nanoseconds
  - Integer microseconds real/scaled
  - Full virtual clock
  implementation_constraints:
  - Public behavior must remain traceable to normative requirements.
  - Changes require ADR supersession and schema/traceability updates.
  verification_implications:
  - Decision-specific contract and regression tests are required.
  revisit_triggers:
  - A validated use case requires coordinated receiver test clocks.
  related_or_superseded_adrs: []
- id: ADR-007
  title: Use SQLite WAL, synchronous FULL, and one writer
  status: accepted
  date: '2026-07-26'
  owners:
  - principal architect
  - future maintainer
  context_and_forces: Use SQLite WAL, synchronous FULL, and one writer
  requirements_affected:
  - DATA-001
  - DATA-002
  - DATA-003
  - REL-010
  risks_affected:
  - RISK-007
  decision_criteria:
  - correctness
  - testability
  - security
  - local-first operation
  - solo-maintainer complexity
  - cross-platform behavior
  options_considered:
  - SQLite rollback journal
  - SQLite WAL NORMAL
  - SQLite WAL FULL single writer
  - PostgreSQL
  evidence_source_ids:
  - SRC-026
  - SRC-027
  - SRC-028
  - SRC-029
  selected_decision: Store mutable execution state in SQLite with WAL, synchronous=FULL, foreign keys, one writer connection,
    and append-oriented evidence.
  positive_consequences:
  - Local and CI portability.
  - Strong transaction semantics and crash tests.
  - No service dependency.
  negative_consequences:
  - Power-loss durability has filesystem limits.
  - One writer limits mutation throughput, which is acceptable.
  rejected_alternatives:
  - SQLite rollback journal
  - SQLite WAL NORMAL
  - SQLite WAL FULL single writer
  - PostgreSQL
  implementation_constraints:
  - Public behavior must remain traceable to normative requirements.
  - Changes require ADR supersession and schema/traceability updates.
  verification_implications:
  - Decision-specific contract and regression tests are required.
  revisit_triggers:
  - A hosted multi-worker product becomes a committed scope.
  - Measured writer contention violates budgets.
  related_or_superseded_adrs: []
- id: ADR-008
  title: Separate manifest, run, event, delivery, attempt, observation, and assertion identities
  status: accepted
  date: '2026-07-26'
  owners:
  - principal architect
  - future maintainer
  context_and_forces: Separate manifest, run, event, delivery, attempt, observation, and assertion identities
  requirements_affected:
  - FR-004
  - DATA-006
  - DATA-007
  - REL-007
  risks_affected:
  - RISK-008
  decision_criteria:
  - correctness
  - testability
  - security
  - local-first operation
  - solo-maintainer complexity
  - cross-platform behavior
  options_considered:
  - One event ID everywhere
  - Run-scoped integer IDs only
  - Layered typed identities
  evidence_source_ids:
  - SRC-007
  - SRC-013
  - SRC-064
  selected_decision: Use content-derived manifest and planned entity IDs, plus a unique execution run_id and separately generated
